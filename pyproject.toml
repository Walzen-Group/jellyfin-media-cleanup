[project]
name = "jellyfin-media-cleanup"
version = "0.1.0"
description = "Automatic media cleanup based on Jellyfin watch metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "rapidfuzz",
    "rich>=14.3.3",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_cleanup"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-recording>=0.13.4",
    "vcrpy>=8.1.1",
]

[project.scripts]
media-cleanup = "media_cleanup.launch:run"
